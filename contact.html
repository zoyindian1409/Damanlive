<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Support | Daman Game Official Website</title>

<meta name="description" content="Contact Daman Game support team for assistance, inquiries, and account-related help.">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Poppins',sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:0;
}

.container{
    max-width:800px;
    margin:auto;
    padding:80px 20px;
    text-align:center;
}

h1{
    font-size:42px;
    margin-bottom:20px;
}

p{
    font-size:18px;
    line-height:1.8;
    color:#d1d5db;
}

.contact-box{
    margin-top:30px;
    padding:30px;
    background:#111827;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.1);
}

.contact-box a{
    color:#00e5ff;
    text-decoration:none;
    font-weight:600;
}

.contact-box a:hover{
    text-decoration:underline;
}

.back-btn{
    display:inline-block;
    margin-top:30px;
    padding:14px 30px;
    background:#00e5ff;
    color:#000;
    text-decoration:none;
    border-radius:10px;
    font-weight:600;
    transition:0.3s;
}

.back-btn:hover{
    transform:translateY(-2px);
}

</style>

</head>

<body>

<div class="container">

    <h1>Contact Support</h1>

    <p>
        If you need any assistance, have questions, or require support, feel free to contact us.
    </p>

    <div class="contact-box">
        <p>
            📧 Email:
            <a href="mailto:info@damangamelive.online">
                info@damangamelive.online
            </a>
        </p>
    </div>

    <a class="back-btn" href="index.html">⬅ Back to Home</a>

</div>

</body>
</html>
